<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Transform Origin Picker</title>
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #17181b;
    --panel-2: #1e2023;
    --border: #2a2c30;
    --text: #e9eaec;
    --muted: #7d8087;
    --accent: #7CFF6B;
    --accent-dim: #7CFF6B33;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 28px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .2px;
    margin: 0 0 3px;
  }
  h1 span {
    color: var(--accent);
    font-family: var(--mono);
  }
  p.sub {
    color: var(--muted);
    font-size: 12.5px;
    margin: 0;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  #dropzone {
    flex: 1;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #dropzone.drag { border-color: var(--accent); color: var(--text); }
  #dropzone input { display: none; }
  #dropzone .key { color: var(--accent); font-family: var(--mono); }

  #stage {
    position: relative;
    display: none;
    flex: 1;
    min-width: 0;
    line-height: 0;
    cursor: crosshair;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background-image:
      linear-gradient(45deg, #2b2c30 25%, transparent 25%),
      linear-gradient(-45deg, #2b2c30 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2b2c30 75%),
      linear-gradient(-45deg, transparent 75%, #2b2c30 75%);
    background-size: 18px 18px;
    background-position: 0 0, 0 9px, 9px -9px, -9px 0px;
    background-color: #131417;
  }
  #stage img {
    display: block;
    width: 100%;
    max-height: 74vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .guide {
    position: absolute;
    background: var(--accent-dim);
    pointer-events: none;
  }
  .guide.h { left: 0; right: 0; height: 1px; }
  .guide.v { top: 0; bottom: 0; width: 1px; }
  #marker {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: var(--accent-dim);
    pointer-events: none;
    display: none;
    transition: left .06s linear, top .06s linear;
  }
  #marker::before, #marker::after { content: ""; position: absolute; background: var(--accent); }
  #marker::before { left: 50%; top: -1000px; bottom: -1000px; width: 1px; opacity: .35; }
  #marker::after { top: 50%; left: -1000px; right: -1000px; height: 1px; opacity: .35; }

  aside {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  .field-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .field {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
  }
  .field label {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 3px;
  }
  .field input {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
  }
  .unit-toggle {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 2px;
    margin-bottom: 14px;
  }
  .unit-toggle button {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 5px 0;
    border-radius: 5px;
    cursor: pointer;
  }
  .unit-toggle button.active {
    background: var(--panel);
    color: var(--accent);
  }

  .dpad-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 14px;
  }
  .dpad {
    display: grid;
    grid-template-columns: 34px 34px 34px;
    grid-template-rows: 34px 34px 34px;
    gap: 4px;
  }
  .dpad button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad button:hover { border-color: var(--accent); color: var(--accent); }
  .dpad button:active { background: var(--accent-dim); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .center { grid-column: 2; grid-row: 2; font-family: var(--mono); font-size: 10px; color: var(--muted); cursor: default; }
  .dpad .center:hover { border-color: var(--border); color: var(--muted); }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .steps button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 6px 0;
    cursor: pointer;
  }
  .steps button.active { border-color: var(--accent); color: var(--accent); }

  code#css {
    display: block;
    font-family: var(--mono);
    font-size: 12.5px;
    background: #0f1012;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 10px;
  }
  .actions { display: flex; gap: 8px; }
  button.primary {
    flex: 1;
    background: var(--accent);
    color: #0b0c0e;
    border: none;
    border-radius: 7px;
    padding: 9px 0;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--text); }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
    font-family: var(--mono);
    font-size: 10px;
  }
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    aside { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>Transform <span>Origin</span> Picker</h1>
  <p class="sub">Kliknij punkt na obrazku, doprecyzuj strzałkami, skopiuj CSS.</p>
</header>

<div class="app">
  <div id="dropzone">
    Przeciągnij obrazek albo kliknij, żeby wybrać plik<br>
    <span class="key">PNG / JPG / WEBP</span>
  </div>

  <div id="stage" tabindex="0">
    <img id="img" alt="preview">
    <div class="guide h" id="guideH"></div>
    <div class="guide v" id="guideV"></div>
    <div id="marker"></div>
  </div>

  <aside id="panel">
    <div class="field-row">
      <div class="field">
        <label>X</label>
        <input type="number" id="xInput" step="0.1">
      </div>
      <div class="field">
        <label>Y</label>
        <input type="number" id="yInput" step="0.1">
      </div>
    </div>

    <div class="unit-toggle">
      <button id="unitPct" class="active">%</button>
      <button id="unitPx">px</button>
    </div>

    <div class="dpad-wrap">
      <div class="dpad">
        <button class="up" id="btnUp">↑</button>
        <button class="left" id="btnLeft">←</button>
        <div class="center" id="stepLabel">1</div>
        <button class="right" id="btnRight">→</button>
        <button class="down" id="btnDown">↓</button>
      </div>
    </div>

    <div class="steps">
      <button data-step="0.1">0.1</button>
      <button data-step="1" class="active">1</button>
      <button data-step="5">5</button>
    </div>

    <code id="css">transform-origin: 0% 0%;</code>
    <div class="actions">
      <button class="primary" id="copyBtn">Kopiuj CSS</button>
      <button class="ghost" id="resetBtn">Nowy</button>
    </div>

    <div class="hint">
      Strzałki na klawiaturze też działają (po kliknięciu w obrazek), <kbd>Shift</kbd> = większy krok.
    </div>
  </aside>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*';
  const stage = document.getElementById('stage');
  const img = document.getElementById('img');
  const marker = document.getElementById('marker');
  const guideH = document.getElementById('guideH');
  const guideV = document.getElementById('guideV');
  const panel = document.getElementById('panel');
  const xInput = document.getElementById('xInput');
  const yInput = document.getElementById('yInput');
  const cssEl = document.getElementById('css');
  const copyBtn = document.getElementById('copyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const unitPct = document.getElementById('unitPct');
  const unitPx = document.getElementById('unitPx');
  const stepLabel = document.getElementById('stepLabel');
  const stepButtons = document.querySelectorAll('.steps button');

  let xPct = 0, yPct = 0, hasPoint = false, unit = 'pct', step = 1;

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      stage.style.display = 'block';
      panel.style.display = 'block';
      dropzone.style.display = 'none';
    };
  }

  function setPoint(xr, yr, animate) {
    xPct = Math.min(100, Math.max(0, xr));
    yPct = Math.min(100, Math.max(0, yr));
    hasPoint = true;
    render();
  }

  function render() {
    const rect = img.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const left = (rect.left - stageRect.left) + (xPct / 100) * rect.width;
    const top = (rect.top - stageRect.top) + (yPct / 100) * rect.height;

    marker.style.display = 'block';
    marker.style.left = left + 'px';
    marker.style.top = top + 'px';
    guideH.style.top = top + 'px';
    guideV.style.left = left + 'px';

    if (unit === 'pct') {
      xInput.value = xPct.toFixed(1);
      yInput.value = yPct.toFixed(1);
    } else {
      xInput.value = Math.round((xPct/100) * img.naturalWidth);
      yInput.value = Math.round((yPct/100) * img.naturalHeight);
    }

    cssEl.textContent = `transform-origin: ${xPct.toFixed(1)}% ${yPct.toFixed(1)}%;`;
  }

  stage.addEventListener('click', e => {
    const rect = img.getBoundingClientRect();
    const xr = ((e.clientX - rect.left) / rect.width) * 100;
    const yr = ((e.clientY - rect.top) / rect.height) * 100;
    setPoint(xr, yr);
    stage.focus();
  });

  stage.addEventListener('keydown', e => {
    if (!hasPoint) return;
    const s = e.shiftKey ? step * 5 : step;
    if (e.key === 'ArrowUp') { e.preventDefault(); setPoint(xPct, yPct - s); }
    if (e.key === 'ArrowDown') { e.preventDefault(); setPoint(xPct, yPct + s); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); setPoint(xPct - s, yPct); }
    if (e.key === 'ArrowRight') { e.preventDefault(); setPoint(xPct + s, yPct); }
  });

  document.getElementById('btnUp').onclick = () => setPoint(xPct, yPct - step);
  document.getElementById('btnDown').onclick = () => setPoint(xPct, yPct + step);
  document.getElementById('btnLeft').onclick = () => setPoint(xPct - step, yPct);
  document.getElementById('btnRight').onclick = () => setPoint(xPct + step, yPct);

  stepButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      stepButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      step = parseFloat(btn.dataset.step);
      stepLabel.textContent = btn.dataset.step;
    });
  });

  unitPct.addEventListener('click', () => {
    unit = 'pct'; unitPct.classList.add('active'); unitPx.classList.remove('active'); render();
  });
  unitPx.addEventListener('click', () => {
    unit = 'px'; unitPx.classList.add('active'); unitPct.classList.remove('active'); render();
  });

  xInput.addEventListener('change', () => {
    const v = parseFloat(xInput.value) || 0;
    const xr = unit === 'pct' ? v : (v / img.naturalWidth) * 100;
    setPoint(xr, yPct);
  });
  yInput.addEventListener('change', () => {
    const v = parseFloat(yInput.value) || 0;
    const yr = unit === 'pct' ? v : (v / img.naturalHeight) * 100;
    setPoint(xPct, yr);
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(cssEl.textContent).then(() => {
      copyBtn.textContent = 'Skopiowano ✓';
      setTimeout(() => copyBtn.textContent = 'Kopiuj CSS', 1100);
    });
  });

  resetBtn.addEventListener('click', () => {
    stage.style.display = 'none';
    panel.style.display = 'none';
    dropzone.style.display = 'block';
    marker.style.display = 'none';
    hasPoint = false;
    img.src = '';
  });

  window.addEventListener('resize', () => { if (hasPoint) render(); });
</script>

</body>
</html>
